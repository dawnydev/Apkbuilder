name: Universal APK Builder

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar o workflow manualmente no GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Fazer o Checkout do Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Padrão recomendado para as versões mais recentes do Gradle

      - name: 📦 Extrair o Projeto
        run: |
          # Descompacta o arquivo project.zip para a pasta source_code
          unzip -q project.zip -d source_code
          
      - name: 🔧 Corrigir erro do AAPT2 e SDK
        run: |
          cd source_code
          # Remove a linha problemática do gradle.properties (que causou a falha no aapt2)
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true
          
          # Dá permissão de execução ao Gradle
          chmod +x gradlew

      - name: 🔨 Compilar o Aplicativo
        working-directory: ./source_code
        run: ./gradlew assembleDebug --no-daemon

      - name: 🏷️ Renomear para Project.apk
        run: |
          # Encontra o APK gerado (geralmente em app/build/outputs/apk/debug/app-debug.apk) e renomeia
          mv source_code/app/build/outputs/apk/debug/app-debug.apk Project.apk

      - name: 🚀 Upload do Arquivo Project.apk
        uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-Output
          path: Project.apk
